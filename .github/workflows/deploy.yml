# Reusable Lunova deploy workflow (v2). Public on purpose: it contains no secrets.
# There is NO key, secret or variable to configure. The runner proves who it is with GitHub's OIDC token; the server
# (lunova-gate) only accepts repositories owned by an allowed owner, running THIS workflow, and binds each site to the
# repository and branch that first registered it.
name: lunova-deploy

on:
  workflow_call:
    inputs:
      mode:
        description: "deploy | check | rollback | status | logs"
        type: string
        default: deploy
      manifest:
        type: string
        default: .lunova.yml
      rollback_to:
        description: "Release id to roll back to (empty = previous healthy release)"
        type: string
        default: ""
      lines:
        description: "Log lines to show in logs mode"
        type: string
        default: "80"

# The caller must grant id-token: write (the template does).
permissions:
  contents: read
  id-token: write

jobs:
  lunova:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: lunova-${{ github.repository }}
      cancel-in-progress: false
    env:
      MODE: ${{ inputs.mode }}
      MANIFEST: ${{ inputs.manifest }}
      ROLLBACK_TO: ${{ inputs.rollback_to }}
      LOG_LINES: ${{ inputs.lines }}
      LUNOVA_HOST: 152.42.168.192
      LUNOVA_HOST_FPR: SHA256:TwC/N1cK5ZgCM/3hfEKe24DWoYtpBsmU/PdPrnOHV3s
    steps:
      - uses: actions/checkout@v4

      - name: Read manifest
        run: |
          set -euo pipefail
          [ -f "$MANIFEST" ] || { echo "::error::$MANIFEST not found. Run the lunova-deploy skill to create it."; exit 1; }
          {
            echo "SITE=$(yq -r '.site' "$MANIFEST")"
            echo "TYPE=$(yq -r '.type' "$MANIFEST")"
            echo "DOMAINS=$(yq -r '.domains | join(",")' "$MANIFEST")"
            echo "ROOT=$(yq -r '.root // ""' "$MANIFEST")"
            echo "START=$(yq -r '.start // ""' "$MANIFEST")"
            echo "HEALTH=$(yq -r '.health_path // "/"' "$MANIFEST")"
            echo "HTTP_ONLY=$(yq -r '.http_only // false' "$MANIFEST")"
            echo "PHP_VERSION=$(yq -r '.php // ""' "$MANIFEST")"
            echo "NODE_VERSION=$(yq -r '.node // ""' "$MANIFEST")"
            echo "KEEP_NODE_MODULES=$(yq -r '.include_node_modules // false' "$MANIFEST")"
          } >> "$GITHUB_ENV"

      - name: Connect (pinned host key, GitHub OIDC identity)
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh ~/.lunova
          ssh-keygen -q -t ed25519 -N '' -f ~/.ssh/lunova_key          # throwaway key for this run only
          ssh-keyscan -t ed25519 "$LUNOVA_HOST" > ~/.ssh/known_hosts 2>/dev/null
          ssh-keygen -lf ~/.ssh/known_hosts | grep -qF "$LUNOVA_HOST_FPR" \
            || { echo "::error::Server host key does not match the pinned fingerprint. Refusing to connect."; exit 1; }
          printf 'Host lunova\n  HostName %s\n  User deploy\n  IdentityFile ~/.ssh/lunova_key\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n  UserKnownHostsFile ~/.ssh/known_hosts\n' "$LUNOVA_HOST" > ~/.ssh/config
          # token: a fresh short-lived OIDC token per call (builds can outlast one token)
          cat > ~/.lunova/token <<'EOS'
          #!/bin/bash
          set -e
          curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=lunova" \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])'
          EOS
          # lsh <command> [args...]: run a command on the server through the gate (args are quoted safely; stdin is forwarded)
          cat > ~/.lunova/lsh <<'EOS'
          #!/bin/bash
          set -e
          tok=$("$HOME/.lunova/token")
          exec ssh -o BatchMode=yes lunova "LUNOVA_TOKEN=$tok $(printf '%q ' "$@")"
          EOS
          chmod 700 ~/.lunova/token ~/.lunova/lsh
          [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || { echo "::error::No OIDC token available. The caller workflow must set 'permissions: id-token: write'."; exit 1; }
          ~/.lunova/lsh lunova-site list > /dev/null \
            || { echo "::error::The server refused this run. It only accepts repositories owned by lunova-digital or jakiurcore, running the shared Lunova workflow."; exit 1; }

      - name: Preflight (capabilities and domains)
        if: env.MODE == 'check'
        run: |
          set -uo pipefail
          ~/.lunova/lsh lunova-site capabilities
          IFS=, read -ra D <<< "$DOMAINS"
          ~/.lunova/lsh lunova-site check-domain --site "$SITE" "${D[@]}"
          rc=$?
          [ $rc -eq 0 ] && echo "::notice::Preflight passed" || echo "::warning::Domain problems above (DNS may still be propagating)"

      - name: Status
        if: env.MODE == 'status'
        run: |
          set -euo pipefail
          ~/.lunova/lsh lunova-site status "$SITE"

      - name: Logs
        if: env.MODE == 'logs'
        run: |
          set -euo pipefail
          [[ "$LOG_LINES" =~ ^[0-9]+$ ]] || LOG_LINES=80
          ~/.lunova/lsh lunova-site logs "$SITE" --lines "$LOG_LINES"

      - name: Roll back
        if: env.MODE == 'rollback'
        run: |
          set -euo pipefail
          args=(lunova-site rollback "$SITE")
          [ -n "$ROLLBACK_TO" ] && args+=(--to "$ROLLBACK_TO")
          ~/.lunova/lsh "${args[@]}"

      - uses: shivammathur/setup-php@v2
        if: env.MODE == 'deploy' && env.PHP_VERSION != ''
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer:v2

      - uses: actions/setup-node@v4
        if: env.MODE == 'deploy' && env.NODE_VERSION != ''
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build
        if: env.MODE == 'deploy'
        run: |
          set -euo pipefail
          n=$(yq -r '.build // [] | length' "$MANIFEST")
          if [ "$n" -eq 0 ]; then
            case "$TYPE" in
              laravel) cmds=("composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction") ;;
              node|spa|static) cmds=("[ ! -f package.json ] || npm ci" "[ ! -f package.json ] || npm run build --if-present") ;;
              python) cmds=() ;;
            esac
          else
            mapfile -t cmds < <(yq -r '.build[]' "$MANIFEST")
          fi
          for c in "${cmds[@]}"; do echo "::group::$c"; bash -euo pipefail -c "$c"; echo "::endgroup::"; done

      - name: Register site (idempotent; database and packages are provisioned on the server)
        if: env.MODE == 'deploy'
        run: |
          set -euo pipefail
          args=(lunova-site register --site "$SITE" --type "$TYPE" --domains "$DOMAINS" --health-path "$HEALTH")
          [ -n "$ROOT" ] && args+=(--root "$ROOT")
          [ -n "$START" ] && args+=(--start "$START")
          [ "$HTTP_ONLY" = "true" ] && args+=(--http-only)
          db=$(yq -r '.database // ""' "$MANIFEST")
          case "$db" in mysql|postgres|sqlite) args+=(--database "$db") ;; ""|none) ;; *) echo "::error::database must be mysql, postgres, sqlite or none (got '$db')"; exit 1 ;; esac
          [ "$(yq -r '.queue // false' "$MANIFEST")" = "true" ] && args+=(--queue)
          [ "$(yq -r '.scheduler // false' "$MANIFEST")" = "true" ] && args+=(--scheduler)
          while IFS= read -r pkg; do [ -n "$pkg" ] && args+=(--package "$pkg"); done < <(yq -r '.packages // [] | .[]' "$MANIFEST")
          if [ "$(yq -r 'has("hooks")' "$MANIFEST")" = "true" ]; then
            if [ "$(yq -r '.hooks | length' "$MANIFEST")" = "0" ]; then
              args+=(--hook true)   # hooks: [] means "run none"
            else
              while IFS= read -r h; do args+=(--hook "$h"); done < <(yq -r '.hooks[]' "$MANIFEST")
            fi
          fi
          ~/.lunova/lsh "${args[@]}"

      - name: Apply sealed environment (.lunova/env.sealed)
        if: env.MODE == 'deploy'
        run: |
          set -euo pipefail
          if [ -f .lunova/env.sealed ]; then
            ~/.lunova/lsh lunova-site apply-env "$SITE" < .lunova/env.sealed
          else
            echo "No .lunova/env.sealed: the server builds .env from .env.example, its own defaults and generated database credentials."
          fi

      - name: Upload release
        if: env.MODE == 'deploy'
        run: |
          set -euo pipefail
          ID="${GITHUB_SHA::12}-${GITHUB_RUN_NUMBER}"
          echo "RELEASE_ID=$ID" >> "$GITHUB_ENV"
          # .env.example is uploaded (the server seeds the app's .env from it); real env files and Lunova files are not
          ex=(--include '.env.example' --exclude .git --exclude .github --exclude '.env' --exclude '.env.*' --exclude .lunova --exclude .lunova.yml)
          [ "$KEEP_NODE_MODULES" = "true" ] || ex+=(--exclude node_modules)
          while IFS= read -r e; do [ -n "$e" ] && ex+=(--exclude "$e"); done < <(yq -r '.exclude // [] | .[]' "$MANIFEST")
          rsync -az --delete --mkpath "${ex[@]}" -e "ssh -o BatchMode=yes" --rsync-path "LUNOVA_TOKEN=$(~/.lunova/token) rsync" \
            ./ "lunova:/srv/sites/$SITE/releases/$ID/"

      - name: Release (packages, hooks, switch, health check, auto-rollback)
        if: env.MODE == 'deploy'
        run: |
          set -euo pipefail
          ~/.lunova/lsh lunova-site release "$SITE" "$RELEASE_ID" | tee release.log
          {
            echo "### Lunova deploy: $SITE"
            echo "- Release: \`$RELEASE_ID\`"
            IFS=, read -ra D <<< "$DOMAINS"; for d in "${D[@]}"; do echo "- https://$d"; done
          } >> "$GITHUB_STEP_SUMMARY"
