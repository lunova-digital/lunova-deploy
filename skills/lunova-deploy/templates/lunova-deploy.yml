# Calls the shared Lunova workflow. Generated by the lunova-deploy skill; edit only the branch.
name: Lunova deploy

on:
  push:
    branches: [__BRANCH__]
  workflow_dispatch:
    inputs:
      mode:
        description: "deploy | check | rollback"
        type: choice
        options: [deploy, check, rollback]
        default: deploy
      rollback_to:
        description: "Release id (empty = previous)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  lunova:
    uses: __WORKFLOW_REPO__/.github/workflows/deploy.yml@__WORKFLOW_REF__
    with:
      mode: ${{ inputs.mode || 'deploy' }}
      rollback_to: ${{ inputs.rollback_to || '' }}
    secrets: inherit
