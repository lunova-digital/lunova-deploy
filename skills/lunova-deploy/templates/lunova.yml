# .lunova.yml: tells the Lunova server how to run this project.
# Generated by the lunova-deploy skill. Full reference: lunova-deploy skill, references/manifest.md
site: __SITE__                # unique, lowercase, letters/digits/hyphens
type: __TYPE__                # static | spa | node | python | laravel
domains:
  - __DOMAIN__
# --- optional ---
# root: dist                  # static/spa: folder to serve, relative to the release
# start: node server.js       # node/python: command that listens on $PORT (127.0.0.1)
# php: "8.3"                  # laravel: PHP used by the CI build
# node: "22"                  # Node used by the CI build
# build:                      # commands CI runs before upload (defaults per type if omitted)
#   - composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction
# hooks:                      # commands run on the server inside the new release BEFORE it goes live
#   - php artisan migrate --force   # (omit the key for per-type defaults; use [] for none)
# database: mysql            # server-provisioned MariaDB; DB_* injected, never in LUNOVA_ENV
# queue: true                 # laravel: queue worker service
# scheduler: true             # laravel: schedule:run every minute
# health_path: /              # must answer 2xx/3xx or the release is rolled back automatically
# exclude: [tests, docs]      # extra paths not to upload
# include_node_modules: false # upload node_modules built in CI (default: install on server)
# http_only: false            # true only for testing before DNS/TLS is ready
